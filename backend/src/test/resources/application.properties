spring.application.name=backend
swiftdrop.auth.issuer=https://auth.getswiftdrop.me
swiftdrop.auth.audience=swiftdrop-api
swiftdrop.auth.allowed-origins=http://localhost:5173

# Tests use an in-memory database in PostgreSQL mode; Hibernate creates a fresh schema from the entities each run.
spring.datasource.url=jdbc:h2:mem:swiftdrop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
